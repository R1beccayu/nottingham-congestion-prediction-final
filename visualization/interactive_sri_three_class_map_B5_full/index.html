<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive SRI congestion severity map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #202833;
      background: #f6f7f8;
    }
    header {
      padding: 20px 30px 14px;
      background: white;
      border-bottom: 1px solid #d8dde3;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 24px;
      letter-spacing: 0;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 14px 18px;
      margin-bottom: 12px;
    }
    label {
      display: grid;
      gap: 5px;
      font-size: 13px;
      font-weight: 700;
    }
    select {
      min-width: 160px;
      padding: 7px 9px;
      border: 1px solid #b9c3cf;
      background: white;
      font: inherit;
      font-size: 14px;
    }
    .selected {
      color: #586575;
      font-size: 14px;
      padding-bottom: 8px;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      font-size: 13px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .legend-item span {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
    }
    .legend-item em {
      color: #586575;
      font-style: normal;
    }
    main {
      padding: 18px 24px 30px;
      max-width: 1500px;
      margin: 0 auto;
    }
    .panel {
      background: white;
      border: 1px solid #d8dde3;
      margin-bottom: 18px;
      padding: 16px;
    }
    h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }
    h2 span {
      color: #586575;
      font-weight: 400;
      margin-left: 8px;
    }
    .maps {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }
    .map {
      height: 430px;
      border: 1px solid #cfd6df;
      background: #e9eef3;
    }
    .popup-title {
      font-weight: 700;
      margin-bottom: 4px;
    }
    .loading {
      color: #8a4b00;
    }
    @media (max-width: 900px) {
      .maps { grid-template-columns: 1fr; }
      .map { height: 390px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Interactive spatial-temporal congestion severity map</h1>
    <div class="controls">
      <label>Date
        <select id="date-select"></select>
      </label>
      <label>Prediction origin time
        <select id="time-select"></select>
      </label>
      <div class="selected" id="selected-summary"></div>
    </div>
    <div class="legend">
        <div class="legend-item">
          <span style="background:#2ca25f"></span>
          <strong>Non-cong.</strong>
          <em>SRI &lt;= 0.10</em>
        </div>
        

        <div class="legend-item">
          <span style="background:#f4c430"></span>
          <strong>Cong.</strong>
          <em>0.10 &lt; SRI &lt;= 0.40</em>
        </div>
        

        <div class="legend-item">
          <span style="background:#d7301f"></span>
          <strong>Severe cong.</strong>
          <em>SRI &gt; 0.40</em>
        </div>
        </div>
  </header>
  <main>
    
    <section class="panel" data-horizon="15">
      <h2>15-min horizon <span id="target-15"></span></h2>
      <div class="maps">
        <div>
          <h3>Ground truth</h3>
          <div id="truth-15" class="map"></div>
        </div>
        <div>
          <h3>Predicted</h3>
          <div id="pred-15" class="map"></div>
        </div>
      </div>
    </section>
    
    <section class="panel" data-horizon="30">
      <h2>30-min horizon <span id="target-30"></span></h2>
      <div class="maps">
        <div>
          <h3>Ground truth</h3>
          <div id="truth-30" class="map"></div>
        </div>
        <div>
          <h3>Predicted</h3>
          <div id="pred-30" class="map"></div>
        </div>
      </div>
    </section>
    
    <section class="panel" data-horizon="45">
      <h2>45-min horizon <span id="target-45"></span></h2>
      <div class="maps">
        <div>
          <h3>Ground truth</h3>
          <div id="truth-45" class="map"></div>
        </div>
        <div>
          <h3>Predicted</h3>
          <div id="pred-45" class="map"></div>
        </div>
      </div>
    </section>
    
    <section class="panel" data-horizon="60">
      <h2>60-min horizon <span id="target-60"></span></h2>
      <div class="maps">
        <div>

        </div>
        <div>
          <h3>Predicted</h3>
          <div id="pred-60" class="map"></div>
        </div>
      </div>
    </section>
    
  </main>

    const DATE_FILES = {"2025-02-07":"data/sri_map_2025-02-07.js","2025-02-10":"data/sri_map_2025-02-10.js","2025-02-11":"data/sri_map_2025-02-11.js","2025-02-12":"data/sri_map_2025-02-12.js","2025-02-13":"data/sri_map_2025-02-13.js","2025-02-14":"data/sri_map_2025-02-14.js","2025-02-17":"data/sri_map_2025-02-17.js","2025-02-18":"data/sri_map_2025-02-18.js","2025-02-19":"data/sri_map_2025-02-19.js","2025-02-20":"data/sri_map_2025-02-20.js","2025-02-21":"data/sri_map_2025-02-21.js","2025-02-24":"data/sri_map_2025-02-24.js","2025-02-25":"data/sri_map_2025-02-25.js","2025-02-26":"data/sri_map_2025-02-26.js","2025-02-27":"data/sri_map_2025-02-27.js","2025-02-28":"data/sri_map_2025-02-28.js"};
    const CLASSES = {"0":{"name":"Non-congested","short_name":"Non-cong.","color":"#2ca25f","threshold":"SRI <= 0.10"},"1":{"name":"Congestion","short_name":"Cong.","color":"#f4c430","threshold":"0.10 < SRI <= 0.40"},"2":{"name":"Severe congestion","short_name":"Severe cong.","color":"#d7301f","threshold":"SRI > 0.40"}};
    const HORIZONS = [15,30,45,60];
    const DEFAULT_CENTER = [52.96111983, -1.15892456];
    const DEFAULT_ZOOM = 12;
    const POINT_RADIUS = 7;
    const DEFAULT_ORIGIN = "2025-02-14 08:00";
    const maps = {};
    const markerStore = {};
    const dateLoadPromises = {};
    window.SRI_MAP_DATE_DATA = window.SRI_MAP_DATE_DATA || {};

    function classInfo(classId) {
      return CLASSES[String(classId)] || CLASSES[classId];
    }

    function popupHtml(node, sri, speed, classId, horizon, source, targetTime) {
      const cls = classInfo(classId);
      const speedText = Number.isFinite(Number(speed)) ? `${Number(speed).toFixed(2)} mph` : "N/A";
      return `
        <div class="popup-title">${source}: ${cls.name}</div>
        <div><strong>Node:</strong> ${node.id}</div>
        <div><strong>Countline:</strong> ${node.countline}</div>
        <div><strong>Direction:</strong> ${node.direction}</div>
        <div><strong>Speed:</strong> ${speedText}</div>
        <div><strong>SRI:</strong> ${sri}</div>
        <div><strong>Target time:</strong> ${targetTime}</div>
        <div><strong>Horizon:</strong> ${horizon} min</div>
        <div><strong>Name:</strong> ${node.name}</div>
      `;
    }

    function initMap(elementId) {
      const map = L.map(elementId, { preferCanvas: true }).setView(DEFAULT_CENTER, DEFAULT_ZOOM);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);
      const bounds = [];
      const markers = NODES.map(node => {
        const marker = L.circleMarker([node.lat, node.lon], {
          radius: POINT_RADIUS,
          color: "#ffffff",
          weight: 1.4,
          fillColor: "#999999",
          fillOpacity: 0.9
        }).addTo(map);
        bounds.push([node.lat, node.lon]);
        return marker;
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [24, 24] });
      maps[elementId] = map;
      markerStore[elementId] = markers;
    }

    function loadDateData(date) {
      if (window.SRI_MAP_DATE_DATA[date]) return Promise.resolve(window.SRI_MAP_DATE_DATA[date]);
      if (dateLoadPromises[date]) return dateLoadPromises[date];
      const script = document.createElement("script");
      script.src = DATE_FILES[date];
      dateLoadPromises[date] = new Promise((resolve, reject) => {
        script.onload = () => resolve(window.SRI_MAP_DATE_DATA[date]);
        script.onerror = () => reject(new Error(`Could not load data for ${date}`));
      });
      document.head.appendChild(script);
      return dateLoadPromises[date];
    }

    function updateMap(elementId, horizon, source, classes, sriValues, speedValues, targetTime) {
      const markers = markerStore[elementId];
      markers.forEach((marker, index) => {
        const classId = classes[index];
        const cls = classInfo(classId);
        const node = NODES[index];
        const sri = sriValues[index];
        const speed = speedValues[index];
        marker.setStyle({ fillColor: cls.color });
        marker.bindPopup(popupHtml(node, sri, speed, classId, horizon, source, targetTime));
        marker.bindTooltip(`${node.id}<br>${cls.name}`, { direction: "top", opacity: 0.9 });
      });
    }

    function populateDates() {
      const dateSelect = document.getElementById("date-select");
      const dates = Object.keys(ORIGINS_BY_DATE).sort();
      dateSelect.innerHTML = "";
      dates.forEach(date => {
        const option = document.createElement("option");
        option.value = date;
        option.textContent = date;
        dateSelect.appendChild(option);
      });
      const defaultDate = DEFAULT_ORIGIN.split(" ")[0];
      if (ORIGINS_BY_DATE[defaultDate]) dateSelect.value = defaultDate;
    }

    function populateTimes() {
      const dateSelect = document.getElementById("date-select");
      const timeSelect = document.getElementById("time-select");
      const times = ORIGINS_BY_DATE[dateSelect.value] || [];
      timeSelect.innerHTML = "";
      times.forEach(time => {
        const option = document.createElement("option");
        option.value = time;
        option.textContent = time;
        timeSelect.appendChild(option);
      });
      const [defaultDate, defaultTime] = DEFAULT_ORIGIN.split(" ");
      if (dateSelect.value === defaultDate && times.includes(defaultTime)) {
        timeSelect.value = defaultTime;
      }
    }

    function selectedOrigin() {
      return `${document.getElementById("date-select").value} ${document.getElementById("time-select").value}`;
    }

    async function updateAll() {
      const date = document.getElementById("date-select").value;
      const origin = selectedOrigin();
      const summary = document.getElementById("selected-summary");
      summary.textContent = `Loading ${origin}...`;
      summary.classList.add("loading");
      const records = await loadDateData(date);
      const record = records[origin];
      summary.textContent = `Prediction origin: ${origin}`;
      summary.classList.remove("loading");
      HORIZONS.forEach(horizon => {
        const item = record[String(horizon)];
        document.getElementById(`target-${horizon}`).textContent = item.target;
        updateMap(`truth-${horizon}`, horizon, "Ground truth", item.truthClass, item.truthSri, item.truthSpeed, item.target);
        updateMap(`pred-${horizon}`, horizon, "Predicted", item.predClass, item.predSri, item.predSpeed, item.target);
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      HORIZONS.forEach(horizon => {
        initMap(`truth-${horizon}`);
        initMap(`pred-${horizon}`);
      });
      populateDates();
      populateTimes();
      document.getElementById("date-select").addEventListener("change", function () {
        populateTimes();
        updateAll();
      });
      document.getElementById("time-select").addEventListener("change", updateAll);
      updateAll();
      setTimeout(() => Object.values(maps).forEach(map => map.invalidateSize()), 100);
    });
  </script>
